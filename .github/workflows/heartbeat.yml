name: Heartbeat

# The Heirloom License's "publicly verifiable signal of continued maintenance"
# (Section 4(a)) is recorded as a JSONL append to `heartbeat.log`. Each commit
# is authored by github-actions[bot] AND signed by GitHub's web-flow key —
# committing via the Contents API (PUT /repos/.../contents/{path}) is the
# documented path to get the green "Verified" badge from a workflow. The plain
# `git commit + push` path does NOT sign, even when the author identity is the
# bot.
#
# This workflow fires from FOUR triggers, each producing a distinct entry kind:
#   - schedule (monthly cron) → kind: "monthly"
#   - workflow_dispatch (manual) → kind: "manual"
#   - release.published → kind: "release", with the tag name
#   - repository_dispatch from the private source repo → kind: "commit", with
#     the private-repo SHA
#
# Why all four: a stale schedule cron alone could mask actual abandonment if
# the GitHub account stays alive but development stops. Tying heartbeats to
# private-repo commits via repository_dispatch ties the signal to real work.

on:
  schedule:
    - cron: '0 0 1 * *'         # 1st of every month, 00:00 UTC
  workflow_dispatch:             # manual via Actions UI
  release:
    types: [published]
  repository_dispatch:
    types: [private-repo-commit] # fired by the private repo's heartbeat-dispatch workflow

permissions:
  contents: write                # needed by the Contents API PUT

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Append heartbeat entry via Contents API (GitHub-signed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRIVATE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          # Fetch the current file blob (need the SHA for the optimistic-concurrency
          # check on PUT). The raw content base64-decodes to the existing JSONL.
          CURRENT=$(gh api "/repos/${{ github.repository }}/contents/heartbeat.log")
          BLOB_SHA=$(printf '%s' "$CURRENT" | jq -r '.sha')
          CONTENT=$(printf '%s' "$CURRENT" | jq -r '.content' | base64 -d)

          # Normalize the trigger name into our taxonomy.
          case "$EVENT_NAME" in
            schedule)            KIND="monthly" ;;
            workflow_dispatch)   KIND="manual" ;;
            release)             KIND="release" ;;
            repository_dispatch) KIND="commit" ;;
            *)                   KIND="$EVENT_NAME" ;;
          esac

          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the JSONL line. jq guarantees safe escaping of any string value.
          if [ "$KIND" = "release" ]; then
            ENTRY=$(jq -nc --arg ts "$TS" --arg kind "$KIND" --arg version "$RELEASE_TAG" \
              '{ts: $ts, kind: $kind, version: $version}')
          elif [ "$KIND" = "commit" ]; then
            ENTRY=$(jq -nc --arg ts "$TS" --arg kind "$KIND" --arg sha "$PRIVATE_SHA" \
              '{ts: $ts, kind: $kind, sha: $sha}')
          else
            ENTRY=$(jq -nc --arg ts "$TS" --arg kind "$KIND" \
              '{ts: $ts, kind: $kind}')
          fi

          # Append entry. Bash command substitution `$(...)` strips trailing newlines
          # from the GET → base64 -d output, so CONTENT is always rtrimmed of '\n'
          # regardless of how the file was stored. We explicitly add the separator
          # newline between CONTENT and ENTRY so consecutive entries can never smush
          # onto the same line.
          NEW=$(printf '%s\n%s' "$CONTENT" "$ENTRY")

          # Base64-encode the FULL new file (no line wrapping — the API takes a single
          # base64 string).
          NEW_B64=$(printf '%s' "$NEW" | base64 -w 0)

          echo "Appending heartbeat: $ENTRY"

          # PUT via Contents API — GitHub auto-signs commits made this way.
          # If the blob SHA we passed is stale (concurrent run won the race), this
          # returns 409 and the workflow fails; the workflow is idempotent on retry.
          gh api \
            -X PUT \
            "/repos/${{ github.repository }}/contents/heartbeat.log" \
            -f message="heartbeat: ${EVENT_NAME}" \
            -f content="$NEW_B64" \
            -f sha="$BLOB_SHA" \
            -f branch=main \
            >/dev/null

          echo "Heartbeat committed via Contents API (GitHub-signed)."
